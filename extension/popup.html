<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f3ec; color: #23302a; }
    header { background: #fffdf8; border-bottom: 1px solid #e4ded1; padding: 12px 14px; }
    .name { font-weight: 700; color: #3f6f5a; }
    .tag { font-size: 12px; color: #6b756f; }
    main { padding: 12px 14px; }
    label { font-size: 12px; color: #6b756f; font-weight: 600; }
    .row { display: flex; gap: 6px; margin: 4px 0 10px; }
    input { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid #e4ded1; border-radius: 8px; }
    button { font: inherit; font-weight: 600; background: #3f6f5a; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .status { font-size: 12px; margin-bottom: 10px; }
    .ok { color: #3f6f5a; } .bad { color: #b3261e; }
    .stats { background: #fffdf8; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
    .stats b { font-size: 15px; }
    a { color: #3f6f5a; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="name">Human First</div>
    <div class="tag">AI when it helps. People when it matters.</div>
  </header>
  <main>
    <div class="status" id="status">Checking server...</div>
    <label for="user">Your Human First username</label>
    <div class="row"><input id="user" placeholder="e.g. allison"><button id="save">Save</button></div>
    <div class="stats" id="stats" hidden></div>
    <a id="dash" href="http://127.0.0.1:8787/#footprint" target="_blank">Open my footprint dashboard</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
